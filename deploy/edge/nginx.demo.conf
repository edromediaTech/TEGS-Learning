# nginx du demonstrateur 3D (jalon C1) : http://tegs.local:8081/demo-3d pour le TNI.
# Pile separee du noeud de salle (projet tegs-demo) : fichiers statiques uniquement,
# aucun backend, aucune donnee d'eleve.
server {
    listen 80 default_server;
    server_name tegs.local _;
    root /usr/share/nginx/html;
    # Redirections relatives : publie sur 8081, nginx ecoute sur 80 dans le conteneur
    # (une redirection absolue enverrait le navigateur sur http://tegs.local/...:80).
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml model/gltf-binary;

    location = / {
        return 302 /demo-3d;
    }

    # Le demonstrateur n'appelle aucune API ; l'application pourrait tenter de verifier une
    # session au demarrage : reponse immediate plutot qu'une attente.
    location /api/ {
        return 404;
    }

    location /vendor/ {
        expires 30d;
    }

    location = /demo-3d {
        try_files /demo-3d/index.html =404;
    }

    location /demo-3d/ {
        expires 1h;
        try_files $uri /demo-3d/index.html;
    }

    location / {
        try_files $uri $uri/ /200.html;
    }
}
