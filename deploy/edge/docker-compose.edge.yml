# TEGS-Edge : noeud de salle hors ligne (CDC TEGS-Edge, etape E5).
# Guide d'installation : docs/edge-deploiement.md. Contrat de synchro : docs/edge-sync-api.md.
#
#   cp .env.edge.example .env.edge   # puis remplir (centre, jeton, secret JWT)
#   docker compose -f docker-compose.edge.yml up -d --build
#
# Construire les images demande Internet (npm, images de base) ; ensuite le noeud
# fonctionne sans Internet et se synchronise des que la liaison revient.
name: tegs-edge

x-logging: &logging
  # Rotation des journaux : 5 x 10 Mo par service, le SSD ne sature pas.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Cache WiredTiger plafonne a 1,5 Go (directive du pilote) : la machine (16 Go) sert
    # aussi le backend, nginx et le pool bcrypt des connexions de salle.
    command: ["--wiredTigerCacheSizeGB", "1.5"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build:
      context: ../../backend
    image: tegs-edge-backend:latest
    restart: unless-stopped
    env_file: .env.edge
    environment:
      EDGE_MODE: "1"
      PORT: "3000"
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/tegs_edge
      MODULES_STORAGE_PATH: /data/modules
      GCS_ENABLED: "false"
      FRONTEND_URL: http://tegs.local
    volumes:
      - modules:/data/modules
    depends_on:
      mongo:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: ../../frontend
      dockerfile: ../deploy/edge/Dockerfile.web
      # nginx.edge.conf vit ici, hors du contexte frontend/.
      additional_contexts:
        edge: .
    image: tegs-edge-web:latest
    restart: unless-stopped
    ports:
      - "${LOCAL_PORT:-80}:80"
    volumes:
      - modules:/var/www/tegs-modules:ro
    depends_on:
      - backend
    logging: *logging

volumes:
  mongo-data:
  modules:
