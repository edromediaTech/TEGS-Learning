# nginx d'un noeud TEGS-Edge : http://tegs.local pour les postes de la salle.
server {
    listen 80 default_server;
    server_name tegs.local _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Simulations installees par la synchro (volume partage avec le backend), sinon
    # celles livrees avec l'interface.
    location /simulations/ {
        root /var/www/tegs-modules;
        add_header Access-Control-Allow-Origin *;
        try_files $uri @bundled;
    }
    location @bundled {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # Paquets cmi5 autonomes (launch.html + GLB + model-viewer + Draco).
    location /packages/ {
        root /var/www/tegs-modules;
    }

    # Medias des modules (images, videos, sons, PDF) copies par la synchro.
    location /media/ {
        root /var/www/tegs-modules;
        expires 30d;
    }

    # model-viewer et Draco embarques.
    location /vendor/ {
        add_header Access-Control-Allow-Origin *;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        # Ecrase (et n'ajoute pas) : le backend (trust proxy 1) voit la vraie adresse du
        # poste, sans qu'un poste puisse la falsifier.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    # SPA : toute autre route sert l'application (pages generees ou 200.html).
    location / {
        try_files $uri $uri/ /200.html;
    }
}
